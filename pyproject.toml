[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "gopay-local-console"
version = "0.5.0"
description = "GoPay 本地管理控制台 Python 重构版"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "alembic>=1.15,<2",
  "argon2-cffi>=23.1,<26",
  "cryptography>=44,<47",
  "fastapi>=0.115,<1",
  "pydantic-settings>=2.8,<3",
  "sqlalchemy>=2.0.38,<3",
  "tls-client==1.0.1",
  "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "httpx2>=2.12,<3",
  "pytest>=8.3,<9",
  "pytest-cov>=6,<8",
  "ruff>=0.11,<1",
]

[project.scripts]
gopay-v2 = "gopay_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gopay_app"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers --disable-warnings"
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["B008", "E501", "RUF001", "RUF002", "RUF003"]
